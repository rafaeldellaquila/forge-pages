name: CI — Lint & Typecheck

# Activate by uncommenting the push/pull_request triggers below:
# on:
#   push:
#     branches: ['**']
#   pull_request:
#     branches: [main]

on:
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm run lint

      - name: Run TypeScript check
        run: pnpm run typecheck
