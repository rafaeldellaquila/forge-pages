[tools]
node = "24"
pnpm = "11"

[env]
PNPM_HOME = "~/.local/share/pnpm"
_.path = ["{{config_root}}/node_modules/.bin"]
# Root .env is the single source of truth for local env vars (see docs/SECRETS.md).
# Next.js reads it natively from the project root — no per-app sync needed since the
# MVP rewrite collapsed the monorepo (ADR-0007).
# Loaded for every task and the activated shell; missing file is ignored (fresh clone).
_.file = ".env"

# ─── Dev ─────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start the Next.js dev server (port 3000)"
run = "next dev"

[tasks.preview]
description = "Build via OpenNext and serve on the local Workers runtime (port 8787)"
run = "opennextjs-cloudflare build && wrangler dev"

[tasks.storybook]
description = "Start Storybook for local block component previews (port 6006)"
run = "storybook dev -p 6006"

# ─── Quality ─────────────────────────────────────────────────────────────────

[tasks.lint]
description = "Run Biome check"
run = "biome check ."

[tasks."lint:fix"]
description = "Run Biome with auto-fix"
run = "biome check --write ."

[tasks.typecheck]
description = "TypeScript check"
run = "tsc --noEmit"

# ─── Build ───────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build Next.js for production"
run = "next build"

[tasks."build:cloudflare"]
description = "Build for Cloudflare Workers via the OpenNext adapter"
run = "opennextjs-cloudflare build"

# ─── Workspace ───────────────────────────────────────────────────────────────

[tasks.clean]
description = "Delete build artefacts and caches (keeps node_modules and .env)"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"
for d in .next .open-next .wrangler out; do
  [ -e "$d" ] && { rm -rf "$d"; echo "  removed $d"; }
done
find . -maxdepth 2 -name '*.tsbuildinfo' -not -path './node_modules/*' -delete 2>/dev/null || true
echo "✓ clean"
"""

[tasks.reset]
description = "Nuke node_modules + build artefacts and reinstall from the lockfile"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd "$MISE_PROJECT_ROOT"

# Never touches .env (secrets) or infra/supabase/.temp (cloud project link) —
# both are expensive to recreate and neither is a build artefact.
echo "This deletes: node_modules/ .next/ .open-next/ .wrangler/ out/ *.tsbuildinfo"
echo "It keeps:     .env, pnpm-lock.yaml, infra/supabase/.temp/, local Supabase data"
read -p "Continue? (y/N) " confirm
[[ "$confirm" == "y" || "$confirm" == "Y" ]] || { echo "Aborted."; exit 0; }

for d in node_modules .next .open-next .wrangler out; do
  [ -e "$d" ] && { rm -rf "$d"; echo "  removed $d"; }
done
find . -maxdepth 2 -name '*.tsbuildinfo' -not -path './node_modules/*' -delete 2>/dev/null || true

echo "Reinstalling from the lockfile..."
pnpm install --frozen-lockfile

# esbuild/workerd need postinstall scripts; pnpm 11 blocks them unless allowed in
# pnpm-workspace.yaml's allowBuilds, which is committed — so this should be a no-op.
pnpm approve-builds --all >/dev/null 2>&1 || true

echo "✓ reset complete — run 'mise run dev' (or 'mise run typecheck' to verify)"
"""

# ─── Database ────────────────────────────────────────────────────────────────

[tasks."db:migrate"]
description = "Push pending migrations to the linked cloud project (asks for confirmation)"
run = """
#!/usr/bin/env bash
# Every supabase command needs --workdir infra: config.toml lives at
# infra/supabase/, and running without it creates a stray ./supabase/ dir at the
# repo root and links the project there instead.
echo "⚠️  This applies migrations to the LINKED CLOUD project:"
echo "    ref: $(cat infra/supabase/.temp/project-ref 2>/dev/null || echo '<not linked>')"
read -p "Continue? (y/N) " confirm
if [[ "$confirm" == "y" || "$confirm" == "Y" ]]; then
  supabase db push --workdir infra
else
  echo "Aborted."
fi
"""

[tasks."db:seed"]
description = "Re-apply seed data to the local stack (via db reset — migrations + seed)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# `supabase db execute` does not exist (checked against CLI 2.111 — db has
# diff|push|reset|dump|pull|lint|start). Seeding is driven by config.toml's
# [db.seed] sql_paths, which `db reset` runs after the migrations.
echo "⚠️  This RESETS the local database (drops data), then re-applies"
echo "    infra/supabase/migrations + infra/supabase/seed."
read -p "Continue? (y/N) " confirm
if [[ "$confirm" == "y" || "$confirm" == "Y" ]]; then
  supabase db reset --workdir infra
else
  echo "Aborted."
fi
"""

[tasks."db:backup"]
description = "Manual pg_dump to local backups/ directory"
run = """
#!/usr/bin/env bash
if [ -z "$SUPABASE_DB_HOST" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
  echo "Error: SUPABASE_DB_HOST and SUPABASE_DB_PASSWORD must be set"
  exit 1
fi
TIMESTAMP=$(date +%Y%m%d_%H%M%S)
mkdir -p backups
PGPASSWORD=$SUPABASE_DB_PASSWORD pg_dump \
  -h $SUPABASE_DB_HOST \
  -p 5432 \
  -U postgres \
  -d postgres \
  --no-password \
  --format=custom \
  --file=backups/backup_${TIMESTAMP}.dump
echo "✓ Backup saved: backups/backup_${TIMESTAMP}.dump"
"""

# ─── Generators ──────────────────────────────────────────────────────────────

[tasks."gen:migration"]
description = "Generate a new timestamped SQL migration file. Usage: mise run gen:migration <name>"
run = """
#!/usr/bin/env bash
NAME=${1:-unnamed}
TIMESTAMP=$(date +%Y%m%d%H%M%S)
FILE="infra/supabase/migrations/${TIMESTAMP}_${NAME}.sql"
cat > "$FILE" << EOF
-- Migration: ${NAME}
-- Created at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
-- Description: TODO — describe what this migration does

-- ─── UP ──────────────────────────────────────────────────────────────────────
-- Write your migration SQL below.
-- Note: Supabase migrations are irreversible once applied to production.
-- There is no DOWN migration — plan accordingly.

EOF
echo "✓ Created: $FILE"
echo ""
echo "Reminder: if this migration adds new tables, also:"
echo "  1. Add RLS policies"
echo "  2. Update lib/types/blocks.ts if new data contracts are introduced"
"""

[tasks."gen:block"]
description = "Scaffold a new React block component. Usage: mise run gen:block <name>"
run = """
#!/usr/bin/env bash
NAME=${1:-unnamed}
PASCAL=$(echo "$NAME" | awk -F'-' '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) tolower(substr($i,2))} 1' OFS='')

FILE="components/blocks/${PASCAL}Block.tsx"
if [ -f "$FILE" ]; then
  echo "⚠️  $FILE already exists — skipping"
else
cat > "$FILE" << EOF
import type { ${PASCAL}Block } from '@/lib/types/blocks'

export function ${PASCAL}Block(props: ${PASCAL}Block) {
  return (
    <section className="py-16">
      <div className="container mx-auto px-4">
        {/* TODO: implement ${PASCAL}Block */}
      </div>
    </section>
  )
}
EOF
echo "✓ Created: $FILE"
fi

echo ""
echo "Next steps:"
echo "  1. Add the ${PASCAL}Block interface to lib/types/blocks.ts (+ the BlockType union)"
echo "  2. Add its Zod schema to lib/schemas/blocks.ts"
echo "  3. Register it in the blockComponentMap"
echo "  4. Implement the component in: $FILE"
"""
