# Smoke-test overlay — a throwaway Postgres sidecar so Strapi boots without any real
# credentials, and publishes 1337 on loopback so you can reach it via an SSH tunnel
# (`ssh -L 1337:localhost:1337 user@vm`) without Cloudflare Tunnel or DNS. The image
# already ships the `pg` driver, so no image change is needed and this mirrors the real
# deploy. Bring up only cms + db (skip nocodb/flipt) from the repo root on the VM:
#   docker compose -f infra/vps/docker-compose.yml \
#                  -f infra/vps/docker-compose.smoke.yml up -d --build cms db
# Tear down (including the throwaway DB volume):
#   docker compose -f infra/vps/docker-compose.yml \
#                  -f infra/vps/docker-compose.smoke.yml down -v

services:
  cms:
    ports:
      - "127.0.0.1:1337:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - smoke-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smoke-db:
