[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

# New API keys are not JWTs, so the platform JWT check must be off;
# the function authorizes callers itself by comparing the apikey header.
[functions.handle-lead-webhook]
verify_jwt = false
